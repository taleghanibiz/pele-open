<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پله</title>
<meta name="theme-color" content="#0d0b1f">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="gate" class="gate" data-state="loading">
  <div class="orbs" aria-hidden="true"><i></i><i></i></div>
  <div class="glass gate-box">
    <img src="/logo.svg" class="mark" alt="" width="88" height="88">
    <h1>پله</h1>
    <p class="tagline">کارهای تیم، پله به پله.</p>
    <div class="loader" role="status" aria-label="در حال بررسی ورود"></div>
    <p id="gateNote" class="note" role="alert"></p>
    <button id="signIn" class="gbtn">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>ادامه با گوگل</span>
    </button>
    <form id="reg" class="reg">
      <p>یک قدم تا شروع: اطلاعات تماست را وارد کن.</p>
      <input name="name" class="field" placeholder="نام و نام خانوادگی" maxlength="80" required autocomplete="name">
      <input name="phone" class="field ltr" placeholder="شماره موبایل (09…)" inputmode="tel" maxlength="20" required autocomplete="tel">
      <input name="team" class="field" placeholder="نام تیم یا شرکت (اختیاری)" maxlength="80" autocomplete="organization">
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn primary">شروع</button>
      <small class="fine">این اطلاعات برای سازندهٔ پله (امیرسبحان طالقانی) در Telegram فرستاده می‌شود تا در صورت نیاز با شما در تماس باشد.</small>
    </form>
    <button id="retry" class="btn primary">تلاش دوباره</button>
    <button id="signOutGate" class="btn">ورود با حساب دیگر</button>
    <small class="fine">🔒 فقط برای اعضای دعوت‌شدهٔ تیم‌ها</small>
  </div>
</section>

<main id="app" hidden>
  <header class="glass top">
    <img src="/logo.svg" class="brand" alt="پله" width="36" height="36">
    <div class="hi"><small id="today"></small><b id="hello"></b></div>
    <nav id="tabs" class="tabs" aria-label="تیم‌ها"></nav>
    <div class="actions">
      <button id="cmdBtn" class="btn ghost cmd" title="منوی فرمان (Ctrl+K)">🔍 <kbd>Ctrl K</kbd></button>
      <button id="tgLink" class="btn ghost">اتصال تلگرام</button>
      <button id="membersBtn" class="btn ghost" hidden>اعضا</button>
      <button id="signOut" class="btn ghost">خروج</button>
    </div>
  </header>
  <div class="bar2">
    <div id="filters" class="filters" role="group" aria-label="فیلترها"></div>
    <div class="modes" role="group" aria-label="نما">
      <button id="vBoard" aria-pressed="true">تخته</button>
      <button id="vList" aria-pressed="false">فهرست</button>
      <button id="vCal" aria-pressed="false">تقویم</button>
      <button id="vFlow" aria-pressed="false">فرایندها</button>
      <button id="vNotes" aria-pressed="false">یادداشت‌ها</button>
      <button id="vContacts" aria-pressed="false">مشتریان</button>
    </div>
  </div>
  <nav id="colTabs" class="coltabs" aria-label="ستون‌ها"></nav>
  <div id="view"></div>
</main>

<nav id="bottom" class="bottom glass" hidden>
  <button data-go="board">📋<span>تخته</span></button>
  <button data-go="list">✅<span>فهرست</span></button>
  <button data-go="add" class="plus" aria-label="کار جدید">＋</button>
  <button data-go="cal">📅<span>تقویم</span></button>
  <button data-go="flow">🪜<span>فرایند</span></button>
  <button data-go="notes">📝<span>یادداشت</span></button>
  <button data-go="contacts">👥<span>مشتریان</span></button>
</nav>

<dialog id="dlg" class="glass"><div id="dlgBody"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
